{padding:0 22px}.gallery-card{width:250px;height:190px}}</style></head><body><nav><a class="logo" href="index.html">wishi<span>•</span>tours</a><ul><li><a href="index.html">Home</a></li><li><a href="contact.html">Contact us</a></li></ul></nav><section class="gallery" aria-label="Featured destinations"><h2 class="gallery-title">A world of beautiful possibilities.</h2><div class="gallery-window"><div class="gallery-track"><div class="gallery-card gallery-bali"><span>Bali</span></div><div class="gallery-card gallery-italy"><span>Amalfi</span></div><div class="gallery-card gallery-kyoto"><span>Kyoto</span></div><div class="gallery-card gallery-santorini"><span>Santorini</span></div><div class="gallery-card gallery-bali"><span>Bali</span></div><div class="gallery-card gallery-italy"><span>Amalfi</span></div><div class="gallery-card gallery-kyoto"><span>Kyoto</span></div><div class="gallery-card gallery-santorini"><span>Santorini</span></div></div></div></section><main><section class="hero"><div class="eyebrow">Your journey starts here</div><h1>Tell us your travel wish.</h1><p>Share a few details and we’ll craft a thoughtful itinerary shaped around you.</p></section><form class="booking"><div class="fields"><div><label for="traveler">Full name</label><input id="traveler" placeholder="Your name"></div><div><label for="trip-email">Email address</label><input id="trip-email" type="email" placeholder="you@example.com"></div><div><label for="destination">Dream destination</label><input id="destination" placeholder="Iceland, Vietnam, everywhere..."></div><div><label for="dates">When would you like to go?</label><input id="dates" type="month"></div><div><label for="guests">Number of travellers</label><select id="guests"><option>Just me</option><option>2 travellers</option><option>3–5 travellers</option><option>6+ travellers</option></select></div><div><label for="budget">Estimated budget</label><select id="budget"><option>Choose a range</option><option>Under $1,000</option><opti
