<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Book a Trip — WishiTours</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet"><style>:root{--ink:#15352f;--cream:#f8f5ed;--coral:#ff775f;--sky:#b8e2ee}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:"DM Sans",sans-serif}a{color:inherit;text-decoration:none}nav{display:flex;align-items:center;justify-content:space-between;padding:24px clamp(22px,5vw,78px);background:var(--sky)}.logo{font-weight:700;font-size:23px;letter-spacing:-1.3px}.logo span{color:var(--coral)}nav ul{display:flex;gap:30px;list-style:none;padding:0;margin:0;font-size:14px;font-weight:600}.button{display:inline-flex;border:0;border-radius:999px;padding:14px 23px;background:var(--ink);color:#fff;font:600 14px inherit;cursor:pointer}.hero{text-align:center;padding:72px 22px 40px}.eyebrow{color:#47756a;text-transform:uppercase;font-size:11px;font-weight:700;letter-spacing:1.8px}h1{font:700 clamp(48px,6vw,78px)/.95 "Playfair Display",serif;letter-spacing:-3px;margin:17px 0}.hero p{color:#527068;max-width:500px;margin:0 auto;line-height:1.6}.booking{max-width:850px;margin:12px auto 80px;background:#fff;border-radius:24px;padding:34px;box-shadow:0 18px 40px #15352f16}.fields{display:grid;grid-template-columns:1fr 1fr;gap:0 18px}label{display:block;font-weight:700;font-size:13px;margin:0 0 7px}input,select,textarea{width:100%;border:1px solid #d5e0db;background:#fff;border-radius:10px;padding:13px;margin-bottom:20px;font:14px inherit;color:var(--ink)}textarea{min-height:100px;resize:vertical}.booking .button{background:var(--coral);width:100%;font-size:15px}@media(max-width:700px){nav ul{display:none}.booking{margin:0 16px 50px;padding:24px}.fields{grid-template-columns:1fr}}</style></head><body><nav><a class="logo" href="index.html">wishi<span>•</span>tours</a><ul><li><a href="index.html#places">Destinations</a></li><li><a href="contact.html">Contact us</a></li></ul><a class="button" href="book-trip.html">Book a trip</a></nav><main><section class="hero"><div class="eyebrow">Your journey starts here</div><h1>Tell us your travel wish.</h1><p>Share a few details and we’ll craft a thoughtful itinerary shaped around you.</p></section><form class="booking"><div class="fields"><div><label for="traveler">Full name</label><input id="traveler" placeholder="Your name"></div><div><label for="trip-email">Email address</label><input id="trip-email" type="email" placeholder="you@example.com"></div><div><label for="destination">Dream destination</label><input id="destination" placeholder="Iceland, Vietnam, everywhere..."></div><div><label for="dates">When would you like to go?</label><input id="dates" type="month"></div><div><label for="guests">Number of travellers</label><select id="guests"><option>Just me</option><option>2 travellers</option><option>3–5 travellers</option><option>6+ travellers</option></select></div><div><label for="budget">Estimated budget</label><select id="budget"><option>Choose a range</option><option>Under $1,000</option><option>$1,000–$2,500</option><option>$2,500–$5,000</option><option>$5,000+</option></select></div></div><label for="notes">Anything else we should know?</label><textarea id="notes" placeholder="Your must-sees, travel style, special occasion..."></textarea><button class="button" type="button">Start planning my trip →</button></form></main></body></html>
